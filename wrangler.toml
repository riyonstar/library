# Cloudflare Workers の設定(無料プランで動作)
# 秘密情報(CALIL_APPKEY, VAPID_PRIVATE_KEY)はここに書かず、`npx wrangler secret put ...` で登録します。
name = "kita-library"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# GitHub Pages のオリジン(パスは含めない)。複数ならカンマ区切り。
ALLOWED_ORIGIN = "https://YOUR-GITHUB-USER.github.io"
# 公開済みの books.json / libraries.json のURL
BOOKS_URL = "https://YOUR-GITHUB-USER.github.io/YOUR-REPO/books.json"
LIBRARIES_URL = "https://YOUR-GITHUB-USER.github.io/YOUR-REPO/libraries.json"
# Web Push の公開鍵(generate-vapid.mjs で作成。公開してOK)
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:YOUR-EMAIL@example.com"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"   # `npx wrangler kv namespace create KV` で表示されるID

[triggers]
# 毎時30分に1回、お気に入りの在架状況をチェック(図書館への負荷を抑えるため頻度は低め)
crons = ["30 * * * *"]
